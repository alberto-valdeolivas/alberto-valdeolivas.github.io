{% assign project = include.project %}
<article class="project-card">
  <div class="project-visual project-visual--{{ project.motif }}" aria-hidden="true"><img src="{{ '/assets/img/' | append: project.motif | append: '.svg' | relative_url }}" alt="" loading="lazy" width="520" height="300"><span>{{ project.language }}</span></div>
  <div class="project-content"><p class="eyebrow">{{ project.kind }}</p><h2><a href="{{ project.url }}">{{ project.name }} <span aria-hidden="true">↗</span></a></h2><p>{{ project.description }}</p><p class="project-contribution">{{ project.contribution }}</p><div class="text-links"><a href="{{ project.url }}">Code ↗</a><a href="{{ project.docs }}">{{ project.docs_label | default: 'Documentation' }} ↗</a><a href="{{ project.paper }}">Paper ↗</a></div></div>
</article>
